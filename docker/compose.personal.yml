# Personal HaspelSync image built from personal/docker-native-tags.
# Run from the repository root:
#   docker compose -f docker/compose.personal.yml up -d
#
# The :personal tag is updated on every push to the personal branch.
# For reproducible deployments, pin to a :personal-<commit> image tag.
services:
  haspelsync:
    image: ghcr.io/saileshkotha/haspelsync:personal
    container_name: haspelsync
    ports:
      - "4000:4000"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/printers:/app/printers
      - ./data/logs:/app/logs
    restart: unless-stopped
